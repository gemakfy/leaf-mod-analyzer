[package]
name = "mod_analyzer_core"
version = "0.1.0"
edition = "2021"
description = "Native Rust acceleration core for Mod Analyzer"

[lib]
name = "mod_analyzer_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "leaf-mod-analyzer"
path = "src/main.rs"

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.30", features = ["abi3-py310", "extension-module"], optional = true }
zip = { version = "9.1", default-features = false, features = ["deflate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
fancy-regex = "0.20"
sha2 = { version = "0.11" }
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
