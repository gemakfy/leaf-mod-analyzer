[package]
name = "mod_analyzer_core"
version = "0.1.0"
edition = "2021"
description = "Native Rust acceleration core for Mod Analyzer"

[lib]
name = "mod_analyzer_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py310", "extension-module"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
fancy-regex = "0.14"
sha2 = { version = "0.10", features = ["asm"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
